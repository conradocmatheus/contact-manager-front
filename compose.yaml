version: "3.8"

services:
  front:
    image: node:22-alpine
    container_name: contact-manager-front
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --poll=2000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4200').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
